[project]
name = "rhinodiet"
version = "0.1.0"
description = "Cursor plugin that cuts token use with compression, delegation, and graph memory."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "tiktoken>=0.7"]

[project.scripts]
rhinodiet = "rhinodiet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
